[project]
name = "njiwa-shopify"
version = "0.1.0"
description = "WhatsApp your Shopify customers through Njiwa when their order is paid, sent, cancelled or refunded."
authors = [{ name = "UPEO.AI", email = "hello@upeo.ai" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "httpx>=0.28.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[project.urls]
Homepage = "https://njiwa.upeo.ai"
Documentation = "https://docs.njiwa.upeo.ai"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["njiwa_shopify"]

[tool.ruff]
# The same as the rest of this repo, so a file moved between them does not
# reformat itself.
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
